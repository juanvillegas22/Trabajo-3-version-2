<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Petición 4</title>

  <style>
      body {
          font-family: Arial, sans-serif;
          background: #0f172a;
          color: #e2e8f0;
          padding: 40px;
      }

      .box {
          max-width: 900px;
          margin: auto;
          background: #1e293b;
          padding: 35px;
          border-radius: 18px;
          border: 1px solid #334155;
      }

      a {
          color: #7dd3fc;
          text-decoration: none;
          font-size: 16px;
      }

      h1 {
          margin-top: 25px;
          color: #f8fafc;
      }

      p {
          color: #cbd5e1;
          line-height: 1.6;
      }

      .lista {
          margin-top: 30px;
          display: flex;
          flex-direction: column;
          gap: 18px;
      }

      .resultado {
          background: #0f172a;
          padding: 22px;
          border-radius: 14px;
          border-left: 4px solid #38bdf8;
      }

      .pregunta {
          font-size: 18px;
          color: #e2e8f0;
          margin-bottom: 10px;
          font-weight: bold;
      }

      .respuesta {
          font-size: 24px;
          font-weight: bold;
          color: #38bdf8;
      }

      .explicacion {
          margin-top: 8px;
          color: #94a3b8;
          font-size: 14px;
      }
  </style>

</head>

<body>

<div class="box">

  <a href="/">← Volver</a>

  <h1>Petición 4 · Suma del Stack con Function</h1>

  <p>
    Se utiliza la interfaz <b>Function&lt;T, R&gt;</b> para sumar todos los datos
    guardados en el Stack <b>conteo</b> de cada objeto <b>Ataque</b>.
  </p>

  <div class="lista">

    <div class="resultado" th:each="entry : ${resultadosFuncion}">

      <div class="pregunta"
           th:text="${entry.key.nombre} + ' · Conteo: ' + ${entry.key.conteo}">
      </div>

      <div class="respuesta"
           th:text="'Suma total: ' + ${entry.value}">
      </div>

      <div class="explicacion"
           th:text="${entry.key.enumAtaque} + ' · ' + ${entry.key.categoria}">
      </div>

    </div>

  </div>

</div>

</body>

</html>
