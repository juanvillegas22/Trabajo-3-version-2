<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tercer Trabajo CES2 - Juan Diego Villegas Llano</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #1f2937;
            margin: 0;
            padding: 24px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            padding: 24px 32px;
        }
        h1 {
            margin-top: 0;
            color: #111827;
            font-size: 1.6rem;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 12px;
        }
        h2 {
            color: #2563eb;
            font-size: 1.2rem;
            margin-top: 12px;
        }
        .nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .nav a {
            text-decoration: none;
            background-color: #2563eb;
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background-color 0.15s ease;
        }
        .nav a:hover {
            background-color: #1d4ed8;
        }
        .resultado-box {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 16px;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 0.92rem;
            line-height: 1.6;
        }
        .linea {
            padding: 4px 6px;
            border-bottom: 1px dashed #e5e7eb;
            white-space: pre-wrap;
        }
        .linea:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Tercer Trabajo del 15% CES2 - Juan Diego Villegas Llano (Tema: La acción de atacar)</h1>

    <div class="nav">
        <a th:href="@{/}">Ver Todos los Puntos</a>
        <a th:href="@{/peticion1}">Petición 1 (Punto 1)</a>
        <a th:href="@{/peticion2}">Petición 2 (Punto 2)</a>
        <a th:href="@{/peticion3}">Petición 3 (Punto 3)</a>
        <a th:href="@{/peticion4}">Petición 4 (Punto 4)</a>
        <a th:href="@{/peticion5}">Petición 5 (Punto 5)</a>
    </div>

    <h2 th:if="${tituloPunto}" th:text="${tituloPunto}">Resultado</h2>

    <div class="resultado-box">
        <div class="linea" th:each="r : ${resultado}" th:text="${r}"></div>
    </div>
</div>
</body>
</html>
